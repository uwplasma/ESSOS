[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["essos"]

[tool.setuptools_scm]
write_to = "essos/version.py"

[project]
name = "essos"
description = "ESSOS: e-Stellarator Simulation and Optimization Suite"
readme = "README.md"
authors = [{ name = "UWPlasma, UW-Madison group", email = "rogerio.jorge@wisc.edu" }]
license = { file = "LICENSE" }
dynamic = ["version"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["Plasma", 
     "Physics", 
     "Simulation",
     "JAX"]
 
dependencies = [ 
    "jax", 
    "jaxlib", 
    "tqdm", 
    "matplotlib", 
    "diffrax", 
    "optax", 
    "jaxopt", 
    "optimistix", 
    "scipy", 
    "jaxkd", 
    "netcdf4",
    # Used internally by SurfaceRZFourier.to_vtk() and Coils.to_vtk().
    "pyevtk",
]

# pyQSC_JAX is not on PyPI, and PyPI rejects any distribution that names a
# direct URL, so it cannot be declared here at all -- not even as an extra.
# The near-axis entry points import it lazily and raise with the install
# command; see "Optional: near-axis fields" in the README.
#   pip install git+https://github.com/uwplasma/pyQSC_JAX.git 
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/uwplasma/ESSOS"

[project.scripts]
essos = "essos.__main__:main"
