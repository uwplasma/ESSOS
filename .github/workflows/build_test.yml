name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12']
    name: Python ${{ matrix.python-version }} Test

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install ESSOS
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest coverage pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=examples_old
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=examples_old

    - name: Run tests with coverage
      env:
        JAX_ENABLE_X64: "1"
        JAX_PLATFORMS: cpu
      run: |
        pytest --cov-branch --cov-report=xml --cov=essos

    - name: Run VMEC extender unit tests
      env:
        JAX_ENABLE_X64: "1"
        JAX_PLATFORMS: cpu
      run: |
        pytest -q tests/test_vmec_extended_field_adapter.py tests/test_vmec_extender_cli.py

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v6.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/ESSOS

  docs:
    runs-on: ubuntu-22.04
    name: Docs
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .
        python -m pip install -r docs/requirements.txt
    - name: Build docs
      run: |
        python -m sphinx -b html docs docs/_build/html
