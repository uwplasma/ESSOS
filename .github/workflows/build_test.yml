name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Hosted and cheap: runs for fork PRs too, which never reach the self-hosted runners.
  lint:
    runs-on: ubuntu-22.04
    name: Lint and import smoke
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install ESSOS and flake8
      run: |
        python -m pip install --upgrade pip
        pip install . flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=examples_old
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=examples_old
    - name: Import smoke test
      run: python -c "import essos, essos.fields, essos.dynamics, essos.coils"

  build:
    # never run fork code on the org's own machines
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && matrix.python-version == '3.12' && !matrix.jax)) && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14']
        jax: ['']
        include:
          - python-version: '3.12'
            jax: '0.8.2'
            suffix: ', JAX 0.8.2'
    name: Python ${{ matrix.python-version }} Test${{ matrix.suffix }}

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install ESSOS and test tools
      run: |
        uv venv
        uv pip install ".[booz]" pytest pytest-cov pytest-xdist ${{ matrix.jax && format('jax=={0} jaxlib=={0}', matrix.jax) || '' }}
        if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
        echo "JAX_VERSION=$(uv run --no-sync python -c 'import jax; print(jax.__version__)')" >> $GITHUB_ENV
    - name: Cache JAX compilations
      uses: actions/cache@v4
      with:
        path: ~/.cache/essos/xla
        key: xla-${{ runner.os }}-py${{ matrix.python-version }}-jax${{ env.JAX_VERSION }}-${{ github.sha }}
        restore-keys: xla-${{ runner.os }}-py${{ matrix.python-version }}-jax${{ env.JAX_VERSION }}-

    - name: Run tests
      if: matrix.python-version != '3.12' || matrix.jax
      run: uv run --no-sync pytest -n 3

    - name: Run tests with coverage
      if: matrix.python-version == '3.12' && !matrix.jax
      run: uv run --no-sync pytest -n 3 --cov-branch --cov-report=xml --cov=essos

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12' && !matrix.jax
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/ESSOS

  oldest:
    runs-on: ${{ (github.event_name != 'pull_request') && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-latest' }}
    name: Python 3.10, oldest supported JAX
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.10'
        enable-cache: false
    - name: Install ESSOS at the declared floors
      run: |
        uv venv
        uv pip install ".[multiobjective]" pytest pytest-xdist "jax==0.6.2" "jaxlib==0.6.2" "equinox==0.13.3" "diffrax==0.7.0" "optimistix==0.0.11"
    - name: Cache JAX compilations
      uses: actions/cache@v4
      with:
        path: ~/.cache/essos/xla
        key: xla-${{ runner.os }}-py3.10-jax0.6.2-${{ github.sha }}
        restore-keys: xla-${{ runner.os }}-py3.10-jax0.6.2-
    - name: Run tests
      run: uv run --no-sync pytest -n 3

  gpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, uwplasma-gpu]
    name: GPU smoke
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.12'
        enable-cache: false
    - name: Install ESSOS with CUDA JAX
      run: |
        uv venv
        uv pip install . pytest 'jax[cuda12]'
    - name: Check that JAX sees the GPU
      run: uv run --no-sync python -c "import jax; assert jax.default_backend()=='gpu', jax.devices()"
    - name: GPU tests
      timeout-minutes: 1
      run: uv run --no-sync pytest -m gpu -q -x -p no:cacheprovider tests/test_gpu.py
