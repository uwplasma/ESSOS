name: Build and Test

on:
  push:
    branches:
    - main
    - en/**
    - fix/**
    - eg/**
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12']
    name: Python ${{ matrix.python-version }} Test

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install ESSOS
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest coverage pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # pyQSC_JAX (near-axis fields) needs Python >= 3.11; on 3.10 its tests are skipped.
        if python -c "import sys; sys.exit(sys.version_info < (3, 11))"; then
          pip install "git+https://github.com/uwplasma/pyQSC_JAX.git"
        fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=examples_old
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=examples_old

    - name: Run tests with coverage
      run: |
        pytest --cov-branch --cov-report=xml --cov=essos

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/ESSOS
