name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ '3.11', '3.12']
    name: Python ${{ matrix.python-version }} Test

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements.txt
    - name: Install ESSOS and test tools
      run: |
        python -m pip install --upgrade pip
        pip install . flake8 pytest pytest-cov pytest-xdist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        echo "JAX_VERSION=$(python -c 'import jax; print(jax.__version__)')" >> $GITHUB_ENV
    - name: Cache JAX compilations
      uses: actions/cache@v4
      with:
        path: ~/.cache/essos/xla
        key: xla-${{ runner.os }}-py${{ matrix.python-version }}-jax${{ env.JAX_VERSION }}-${{ github.sha }}
        restore-keys: xla-${{ runner.os }}-py${{ matrix.python-version }}-jax${{ env.JAX_VERSION }}-
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=examples_old
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=examples_old

    - name: Run tests
      if: matrix.python-version != '3.12'
      run: pytest -n auto

    - name: Run tests with coverage
      if: matrix.python-version == '3.12'
      run: pytest -n auto --cov-branch --cov-report=xml --cov=essos

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/ESSOS

  oldest:
    runs-on: ubuntu-22.04
    name: Python 3.10, oldest supported JAX
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install ESSOS at the declared floors
      run: |
        python -m pip install --upgrade pip
        pip install ".[multiobjective]" pytest pytest-xdist "jax==0.6.2" "jaxlib==0.6.2" "equinox==0.13.3" "diffrax==0.7.0" "optimistix==0.0.11" "jaxtyping<0.3.8" "numpy<2.3"
    - name: Cache JAX compilations
      uses: actions/cache@v4
      with:
        path: ~/.cache/essos/xla
        key: xla-${{ runner.os }}-py3.10-jax0.6.2-${{ github.sha }}
        restore-keys: xla-${{ runner.os }}-py3.10-jax0.6.2-
    - name: Run tests
      run: pytest -n auto
